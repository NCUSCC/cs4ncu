{% extends "main.html" %}

{% block content %}
<div class="md-content" data-md-component="content">
  <article class="md-content__inner md-typeset">
    <div
      class="not-found-container"
      data-404-page
      data-home-url="{{ config.site_url | url }}"
      data-repo-url="{{ config.repo_url }}"
      data-search-index-url="{{ 'search/search_index.json' | url }}"
    >
      <div class="not-found-header">
        <h1>404</h1>
        <p>Page Not Found</p>
      </div>

      <div id="countdown-container">
        <p>我们将在 <span id="countdown-timer">10</span> 秒后自动带您返回首页...
          <a href="#" id="cancel-redirect-link">或者留在此页</a>。
        </p>
      </div>

      <h2>您访问的页面不存在</h2>
      <p>别担心，让我们帮您找到正确的方向。</p>

      <div id="reason-container" class="reason-box"></div>
      <div id="action-container"></div>
    </div>
  </article>
</div>
{% endblock %}
